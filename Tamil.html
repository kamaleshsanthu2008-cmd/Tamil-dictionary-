function searchWord() {

    let word = document
        .getElementById("search")
        .value.trim().toLowerCase();

    let result = document.getElementById("result");

    if (dictionary[word]) {

        let data = dictionary[word];

        result.innerHTML = `
            <p class="tamil">${data.tamil}</p>
            <h3>Meaning:</h3>
            <p>${data.meaning}</p>
            <h3>Example:</h3>
            <p>${data.example}</p>
        `;

    } else {

        result.innerHTML =
            "Sorry! Word not found in our dictionary.";

    }
}
